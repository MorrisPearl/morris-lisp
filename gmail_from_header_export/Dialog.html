<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; padding: 8px 4px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    select, input[type=date] { margin-top: 4px; width: 100%; box-sizing: border-box; }
    .checkbox-row { font-weight: normal; margin-top: 14px; }
    .date-row { display: flex; gap: 10px; }
    .date-row > div { flex: 1; }
    .date-row label { font-weight: normal; font-size: 12px; margin-top: 0; }
    .note { margin-top: 14px; color: #555; line-height: 1.4; }
    #status { margin-top: 16px; line-height: 1.5; }
    button { margin-top: 18px; padding: 6px 14px; }
    a { word-break: break-all; }
  </style>
</head>
<body>
  <label for="scope">What to search:</label>
  <select id="scope">
    <option value="__ALL__">All Mail (every folder except Spam/Trash)</option>
    <option value="__INBOX__">Inbox only</option>
  </select>

  <label>Date range (optional -- leave blank to include all dates):</label>
  <div class="date-row">
    <div>
      <label for="startDate">From</label>
      <input type="date" id="startDate">
    </div>
    <div>
      <label for="endDate">To</label>
      <input type="date" id="endDate">
    </div>
  </div>

  <label class="checkbox-row">
    <input type="checkbox" id="skipNonPeople" checked>
    Skip senders that are not people (info@, no-reply@, hello@, support@, ...)
  </label>

  <div class="note">
    The sheet gets one row per unique sender. A large mailbox takes a long
    time: the export keeps running by itself in the background, so you can
    close this box and even this tab. Use <b>Sender Export &gt; Show progress</b>
    to check on it.
  </div>

  <button id="go">Start Export</button>
  <div id="status"></div>

  <script>
    google.script.run.withSuccessHandler(function(names) {
      if (!names.length) return;
      var select = document.getElementById('scope');
      var group = document.createElement('optgroup');
      group.label = 'Labels';
      names.forEach(function(name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        group.appendChild(opt);
      });
      select.appendChild(group);
    }).getLabelNames();

    document.getElementById('go').addEventListener('click', function() {
      var button = document.getElementById('go');
      var status = document.getElementById('status');
      button.disabled = true;
      status.textContent = 'Reading your mail for the first few minutes... please keep this box open until it reports back.';

      google.script.run
        .withSuccessHandler(function(result) {
          status.textContent = result.message + ' ';
          var link = document.createElement('a');
          link.href = result.url;
          link.target = '_blank';
          link.textContent = 'Open the results sheet';
          status.appendChild(link);
        })
        .withFailureHandler(function(err) {
          status.textContent = 'Error: ' + err.message;
          button.disabled = false;
        })
        .startExport({
          scope: document.getElementById('scope').value,
          startDate: document.getElementById('startDate').value,
          endDate: document.getElementById('endDate').value,
          skipNonPeople: document.getElementById('skipNonPeople').checked
        });
    });
  </script>
</body>
</html>
